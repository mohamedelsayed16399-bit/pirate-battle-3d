<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>معركة القراصنة</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#06202b;color:#fff;font-family:system-ui,Tahoma,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:8px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 4px #000;font-weight:700}
#hpw{width:48%}#hpb{height:16px;border-radius:9px;background:#0007;border:2px solid #fff4;overflow:hidden}#hpb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#16a34a,#a3e635)}
#banner{position:fixed;top:28%;left:0;right:0;text-align:center;font-size:42px;font-weight:900;color:#fde68a;text-shadow:0 0 20px #0ea5e9,0 3px 6px #000;opacity:0;transition:opacity .4s;pointer-events:none}
.ab{position:fixed;bottom:34px;border-radius:50%;border:3px solid #fff8;color:#fff;font-weight:900;display:none;align-items:center;justify-content:center;text-align:center;font-size:16px;overflow:hidden}
#b1{right:26px;width:96px;height:96px;background:#b91c1ccc}#b2{right:140px;width:70px;height:70px;bottom:30px;background:#1d4ed8cc;font-size:14px}
.cd{position:absolute;inset:0;background:#000b;clip-path:inset(100% 0 0 0)}
#joy{position:fixed;left:30px;bottom:40px;width:130px;height:130px;border-radius:50%;background:#fff2;border:2px solid #fff5;display:none}#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#fffa}
.scr{position:fixed;inset:0;background:radial-gradient(#0b3a4aee,#04141cf5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.scr h1{font-size:44px;margin:0;color:#fde68a;text-shadow:0 0 24px #0ea5e9}.scr p{margin:0;color:#cbd5e1;max-width:330px;line-height:1.7}
.big{padding:14px 40px;font-size:22px;font-weight:800;border-radius:16px;border:0;background:linear-gradient(#fbbf24,#d97706);color:#2b1300}
#bar{width:220px;height:8px;background:#fff2;border-radius:5px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:#fbbf24}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.card{width:30%;min-width:100px;padding:14px 6px;border-radius:14px;background:#12384a;border:2px solid #fbbf24;font-size:15px;color:#fff}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="hpw"><div id="hpb"><i></i></div><div id="hpt" style="font-size:13px;margin-top:2px">120 / 120</div></div><div style="text-align:left"><div id="wv">الموجة 1</div><div id="sc">0 نقطة</div></div></div>
<div id="banner"></div><div id="joy"><div id="knob"></div></div>
<div class="ab" id="b1">وابل<br>المدافع<div class="cd"></div></div><div class="ab" id="b2">تسارع<div class="cd"></div></div>
<div class="scr" id="menu"><h1>معركة القراصنة</h1><p>أنت قبطان سفينة قراصنة. المدافع تطلق تلقائياً على أقرب عدو. أغرق الأسطول، اختر تطويراتك، وواجه السفينة الشبح!</p><div id="bar"><i></i></div><button class="big" id="go" disabled>جاري التحميل...</button><p style="font-size:13px">اسحب الدائرة لتوجيه السفينة</p></div>
<div class="scr" id="up" style="display:none"><h1 style="font-size:32px">اختر تطويراً</h1><div class="cards" id="cards"></div></div>
<div class="scr" id="over" style="display:none"><h1 id="ot">غرقت السفينة</h1><p id="os"></p><button class="big" id="again">العب مرة أخرى</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

 const R=['rocksA','rocksB','rocksC'];for(let i=0;i<16;i++){const a=i/16*Math.PI*2+Math.random()*.3,d=40+Math.random()*10;const r=mk(R[i%3],5+Math.random()*4,Math.random()*6);r.position.set(Math.cos(a)*d,0,Math.sin(a)*d);scene.add(r)}

function levelUp(){S.state='up';$('up').style.display='flex';hideCtl();const ALL=[['⚔ ضرر المدافع +25%',()=>S.dmg*=1.25],['❤ صحة +30 وإصلاح كامل',()=>{S.mhp+=30;S.hp=S.mhp}],['⛵ سرعة +12%',()=>S.spd*=1.12],['⚡ سرعة الإطلاق +20%',()=>S.rate*=1.2],['◎ مدى المدافع +15%',()=>S.rng*=1.15]];
 const pick=ALL.sort(()=>Math.random()-.5).slice(0,3);const c=$('cards');c.innerHTML='';pick.forEach(([t,f])=>{const b=document.createElement('button');b.className='card';b.textContent=t;b.onclick=()=>{f();S.hp=Math.min(S.mhp,S.hp+S.mhp*.25);$('up').style.display='none';S.state='play';showCtl();spawnWave()};c.appendChild(b)})}
function showCtl(){$('joy').style.display='block';$('b1').style.display='flex';$('b2').style.display='flex'}function hideCtl(){$('joy').style.display='none';$('b1').style.display='none';$('b2').style.display='none'}
function start(){for(const e of enemies)scene.remove(e.m);enemies.length=0;for(const b of balls.concat(eballs))scene.remove(b.m);balls.length=0;eballs.length=0;Object.assign(S,{wave:0,score:0,kills:0,hp:120,mhp:120,dmg:12,rate:1,rng:26,spd:7,god:false,fireT:0,heavy:0,boost:0,inv:0});player.position.set(0,0,0);head=0;$('menu').style.display='none';$('over').style.display='none';S.state='play';showCtl();spawnWave()}

let jid=null,jc={x:0,y:0};const joy=$('joy');

function hud(){$('hpb').firstChild.style.width=Math.max(0,S.hp/S.mhp*100)+'%';$('hpt').textContent=Math.ceil(S.hp)+' / '+Math.ceil(S.mhp);$('sc').textContent=S.score+' نقطة';

let last=performance.now(),qN=0,qS=0,qDone=false;
